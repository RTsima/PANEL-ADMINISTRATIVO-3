<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SIMA SAC · Panel del Administrador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--a:#1d4a8f;--b:#29a5e0;--bg:#f3f6fb;--t:#1e293b;--m:#64748b;--l:#e2e8f0;--ok:#059669;--no:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
header{background:linear-gradient(110deg,var(--a),#173a73 60%,var(--b));color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:54px;background:#fff;border-radius:10px;padding:4px 8px}
header h1{font-size:18px;margin:0}header small{opacity:.85}
header input{width:auto;padding:8px;border:0;border-radius:8px}
.sp{flex:1}
#q{padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;min-width:240px;font:inherit}
button,input,select{font:inherit}
.btn{border:0;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--b);color:#fff}
.btn.w{background:#fff;color:var(--a)}.btn.g{background:var(--a)}
main{max-width:1400px;margin:auto;padding:22px;display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.k{background:#fff;border-radius:14px;padding:16px;border-left:5px solid var(--b);box-shadow:0 2px 8px #1d4a8f14}
.k span{font-size:12px;color:var(--m);font-weight:600}
.k b{display:block;font-size:22px;margin-top:6px}
.k.pos{border-color:var(--ok)}.k.neg{border-color:var(--no)}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px #1d4a8f14}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:800px){.charts{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--l);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 16px;border:0;background:none;font-weight:600;color:var(--m);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--a);border-color:var(--b)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--a);color:#fff;text-align:left;padding:10px;font-size:12px;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--l)}
tbody tr:nth-child(even) td{background:#f8fafd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:#e8f1fb;border-top:2px solid var(--a)}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
.COBRADO{background:#d1fae5;color:#065f46}.PENDIENTE{background:#fef3c7;color:#92400e}
.x{border:0;background:#fee2e2;color:var(--no);border-radius:6px;cursor:pointer;padding:3px 8px}
#login,#modal,#dm{position:fixed;inset:0;background:#0f2a54d9;display:flex;align-items:center;justify-content:center;z-index:9}
.box{background:#fff;border-radius:16px;padding:26px;width:min(92vw,400px);display:grid;gap:12px;max-height:94vh;overflow:auto}
.box input,.box select{padding:9px;border:1px solid #cbd5e1;border-radius:8px;width:100%}
label{font-size:12px;font-weight:600;color:var(--m)}
.k{cursor:pointer}.k:hover{box-shadow:0 4px 14px #1d4a8f33}
.k small{display:block;margin-top:4px;color:var(--b);font-size:11px;font-weight:600}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ms{position:relative}.ms summary{list-style:none;cursor:pointer;display:inline-block}.ms summary::-webkit-details-marker{display:none}
.mp{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px;box-shadow:0 8px 24px #1d4a8f33;z-index:5;width:285px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mp .yr{grid-column:1/-1;display:flex;gap:6px;align-items:center}.mp .yr select{flex:1;padding:7px;border:1px solid #cbd5e1;border-radius:8px;font-weight:600}.mp .yr .btn{padding:6px 12px}
.mp .row{grid-column:1/-1;display:flex;gap:6px}.mp .row .btn{flex:1;padding:8px 6px;font-size:12px}
.mp label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--t);font-weight:500;cursor:pointer}
.act{border:1px solid var(--l);background:#fff;color:var(--a);border-radius:8px;padding:5px 10px;font-weight:600;cursor:pointer;white-space:nowrap}.act:hover{background:#f3f6fb}
.ei{width:100%;min-width:95px;padding:5px;border:1px solid var(--b);border-radius:6px;font:inherit;background:#fff}
#am,#am2{position:fixed;z-index:8;background:#fff;border:1px solid var(--l);border-radius:10px;box-shadow:0 8px 24px #1d4a8f33;padding:4px;display:grid;min-width:140px}
#am button,#am2 button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;font-weight:600;font:inherit;font-weight:600}
#am button:hover,#am2 button:hover{background:#f3f6fb}#am button:disabled,#am2 button:disabled{color:#cbd5e1;cursor:default;background:none}#am .d,#am2 .d{color:var(--no)}
.egr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.box .egr>*{flex:1 1 120px;min-width:0;width:auto}.box .egr>.x,.box .egr>b{flex:0 0 auto}.egc{border:1px solid #cbd5e1;border-radius:12px;padding:10px;display:grid;gap:8px}
.ei2{width:100%;min-width:70px;padding:6px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
.full{position:fixed;inset:0;background:var(--bg);z-index:7;overflow:auto}
.rh{background:#fff;border-bottom:1px solid var(--l);padding:12px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}
.rb{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}
.exp{background:#eaf5fd;border-left:5px solid var(--b);border-radius:10px;padding:12px 16px;color:#0b4a6f;line-height:1.55}
.rc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.rc>div{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #1d4a8f14;border-left:5px solid var(--b)}
.rc small{font-weight:700;color:var(--m);letter-spacing:.04em}.rc b{font-size:24px;display:block;margin:6px 0 4px}.rc em{font-style:normal;font-size:12px;color:var(--m)}
.rc .pos{border-color:var(--ok)}.rc .pos b{color:var(--ok)}.rc .neg{border-color:var(--no)}.rc .neg b{color:var(--no)}
tr.sec td{background:var(--a)!important;color:#fff;font-weight:700}tr.sub td{background:#e8f1fb!important;font-weight:700}
tr.res td{font-size:16px;font-weight:700}tr.res.pos td{background:#d1fae5!important;color:#065f46}tr.res.neg td{background:#fee2e2!important;color:#991b1b}
tr.mut td{color:#cbd5e1}
#dtb .dtop{display:grid;grid-template-columns:1fr 1.4fr 1fr;border:1px solid #cfe3f6;border-radius:14px;background:#fff;margin-bottom:12px}
#dtb .dti{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#1d4a8f}#dtb .dti+.dti{border-left:1px solid #cfe3f6}
#dtb .dti small{display:block;color:#475f85;font-size:12px;font-weight:600;letter-spacing:.04em}#dtb .dti b{display:block;font-size:22px;line-height:1.15;color:#0f3a7a;word-break:break-word}#dtb .dti span{font-size:16px;color:#334155}
#dtb .ddet{border-radius:12px;overflow:hidden;border:1px solid #cfe3f6;margin-bottom:12px}
#dtb .dbar{display:flex;justify-content:space-between;background:#1e293b;color:#fff;font-weight:700;padding:12px 16px;font-size:13px;letter-spacing:.03em}
#dtb .dfac{display:flex;justify-content:space-between;align-items:center;background:#eaf2fd;padding:13px 16px;font-weight:700;font-size:15px;color:#0f172a}#dtb .dfac b{font-size:20px}#dtb .dfac small{display:block;font-weight:500;color:#64748b;font-size:12px}
#dtb .dc{border:1px solid #cfe3f6;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#fff}
#dtb .dch{display:flex;align-items:center;gap:10px;background:#dcebfb;color:#1d4a8f;padding:11px 16px;font-weight:700;font-size:18px}#dtb .dch svg{width:24px;height:24px}
#dtb .dcc{background:#f2f8ff;color:#38557f;font-size:12px;font-weight:700;letter-spacing:.03em;padding:9px 16px}
#dtb .dr{padding:9px 16px;border-top:1px solid #e8eef6;align-items:center;color:#0f172a}
#dtb .g4{display:grid;grid-template-columns:1.3fr 1.1fr .9fr auto;gap:10px}#dtb .g2{display:grid;grid-template-columns:1fr auto;gap:10px}#dtb .g3{display:grid;grid-template-columns:1.3fr 1.5fr auto;gap:10px}
#dtb .dcc.g4,#dtb .dcc.g3,#dtb .dcc.g2{border-top:0}
#dtb .n{text-align:right}#dtb .mu{color:#475f85;font-weight:400}#dtb .dr small{display:block;color:#64748b;font-size:12px;margin-top:2px}
#dtb .dgt{display:flex;align-items:center;gap:10px;background:#fdeaee;border:1px solid #f8cdd5;color:#d1203d;border-radius:12px;padding:14px 16px;font-size:18px;font-weight:700}#dtb .dgt svg{width:26px;height:26px;fill:#ef4458}#dtb .dgt span{flex:1}
@media(max-width:640px){#dtb .dtop{grid-template-columns:1fr}#dtb .dti+.dti{border-left:0;border-top:1px solid #cfe3f6}#dtb .g4{grid-template-columns:1.2fr 1fr .8fr auto;gap:6px;font-size:12px}#dtb .g3{grid-template-columns:1.2fr 1.4fr auto;gap:6px;font-size:12px}}
.est thead th{background:#fde047;color:#1e293b;border-bottom:2px solid #eab308}
.mb{height:8px;background:#e2e8f0;border-radius:99px;min-width:90px}.mb i{display:block;height:100%;background:var(--b);border-radius:99px}
.fct{min-width:1150px;font-size:12px}.fct td,.fct th{padding:7px 9px;white-space:nowrap}
.fct th:first-child,.fct td:first-child{position:sticky;left:0;z-index:1;min-width:210px}.fct th,.fct th:first-child{background:#0f2f63}
.fct tr.hi td{background:#29a5e0!important;color:#fff;font-weight:700}.fct tr.he td{background:#1d4a8f!important;color:#fff;font-weight:700}.fct tr.hc td{background:#5b7fc0!important;color:#fff;font-weight:700}
.fct tr.gi td{background:#f1f9fe!important}.fct tr.gt td{background:#d6ecfa!important;font-weight:700;color:#0b4a73}
.fct tr.ye td{background:#f4f7fc!important}.fct tr.yt td{background:#dbe4f4!important;font-weight:700;color:#14356b}
.fct tr.ce td{background:#eceff5!important;font-weight:700;color:#0f2f63;border-top:1px solid #cbd5e1}
.hide{display:none!important}
</style>
</head>

function lev(a, b) {
  const d = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let p = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] == b[j - 1] ? 0 : 1)); p = t; }
  }
  return d[b.length];
}

function grp(rows, k, v) {   // suma por nombre: DINO, DINO PIURA y DINOURL se juntan bajo el nombre más corto (DINO)

  });
  return gs.map(z => [z.n, z.v, z.c]).sort((a, b) => b[1] - a[1]);
}

function fcData() {

function mat(rows, k, v, mi) {
  const o = {}, gs = [], idx = {}, nm = x => String(x[k] || 'SIN DATO').trim();
  rows.forEach(x => add(o, nm(x), x[v]));
  Object.entries(o).sort((a, b) => b[1] - a[1]).forEach(([n]) => {
    const q = norm(n); let i = gs.findIndex(z => similar(z.k, q));
    if (i < 0) { gs.push({k: q, n, m: Array(12).fill(0), c: 0, t: 0}); i = gs.length - 1; }
    gs[i].c++; idx[n] = i;
  });
  rows.forEach(x => { const m = mi(x); if (m >= 0 && m < 12) gs[idx[nm(x)]].m[m] += +x[v] || 0; });
  gs.forEach(z => z.t = z.m.reduce((t, a) => t + a, 0));
